services:
  plex-path-auditor:
    image: ghcr.io/zduts/plex-path-auditor:latest
    container_name: plex-path-auditor
    environment:
      - PLEX_URL=http://your-plex:32400
      - PLEX_TOKEN=your_plex_token
      - AUTOSCAN_URL=http://your-autoscan:3030
      - AUTOSCAN_USER=your_autoscan_user
      - AUTOSCAN_PASS=your_autoscan_password
      # Library roots walked on disk AND used to scope Plex paths.
      - SCAN_ROOTS=/mnt/plex/TV,/mnt/plex/Movies
      - MEDIA_EXTS=mkv,mp4,avi,m4v,ts
      - RUN_INTERVAL=6h
      - DRY_RUN=true  # set false once the logs look right
      - COOLDOWN_HOURS=24  # don't re-trigger the same dir within this window
      - STATE_FILE=/config/triggered.json
      - PAGE_SIZE=500  # Plex pagination window
      - BATCH_SIZE=50  # max dirs per autoscan request
      - MAX_TRIGGERS=200  # max dirs per run, stale first (0 = unlimited)
      - MAX_STALE_PCT=25  # abort if more than this % of Plex paths is missing (dead mount guard; 100 = off)
      - SKIP_HASH_NAMES=true  # hold 32-hex placeholders out of the Plex diff (resolved Sonarr-side)
      - DUB_LANGS=  # e.g. ITA,FRENCH,GERMAN,SPANISH - report foreign-dubbed files (empty = off)
      # Optional Sonarr: resolve + rename hash files (Plex can never match them).
      # If Sonarr's own Rename Episodes toggle is OFF, set SONARR_TOGGLE_RENAME
      # to flip it on around each run (enable -> preview -> fire -> wait ->
      # restore off, all verified). Otherwise set SKIP_HASH_NAMES=false above
      # to still send those dirs to autoscan.
      - SONARR_URL=http://your-sonarr:8989
      - SONARR_API_KEY=your_sonarr_api_key
      - SONARR_AUTO_RENAME=false  # true = fire RenameFiles (false = log preview only)
      - SONARR_TOGGLE_RENAME=false
      - SONARR_CMD_TIMEOUT=300  # seconds to wait for RenameFiles completion
    volumes:
      # Absolute host path - triggered.json must survive redeploys:
      - /opt/plex-path-auditor/config:/config
      # rslave (not default rprivate): host remounts (e.g. infinidysk re-pull)
      # propagate INTO the container. With rprivate the container keeps showing
      # the stale pre-remount view and every Plex path looks missing.
      # NOTE: changing propagation requires RECREATING the container
      # (Portainer redeploy / --force-recreate); a plain restart keeps old mounts.
      - /mnt:/mnt:ro,rslave
    restart: unless-stopped
